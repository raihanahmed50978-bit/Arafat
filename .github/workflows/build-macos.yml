name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest  # Updated to the latest macOS runner

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install playwright
          pip install python-dotenv

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Build macOS app
        run: |
          pyinstaller \
            --windowed \
            --name "Arafat" \
            main.py

      - name: Create DMG
        run: |
          mkdir -p dmg
          hdiutil create \
            -volname "Arafat" \
            -srcfolder "dist/Arafat.app" \
            -ov \
            -format UDZO \
            "dmg/Arafat.dmg"

      - name: Upload macOS App
        uses: actions/upload-artifact@v4
        with:
          name: Arafat-macOS-app
          path: dist/Arafat.app

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Arafat-macOS-DMG
          path: dmg/Arafat.dmg
